# --- Kyverno (via Helm) ---
- name: Configure Kyverno with proxy settings
  vars:
    kyverno_namespace: "kyverno"
    kyverno_version: "3.5.2"  # Dernière version du chart Helm
    nfq_gateway_ip: "192.168.200.1"
    nfq_proxy_port: "8000"
    nfq_proxy_host: "{{ nfq_gateway_ip }}:{{ nfq_proxy_port }}"
    kyverno_install_policies: true
    kyverno_mutate_prepend: true
    kyverno_enforce: false
    container_name: "kyverno"
    # Sélecteur pour cibler les nœuds masters (utilise le label master=true présent sur tous)
    kyverno_node_selector:
      "node-role.kubernetes.io/master": "true"
    # Tolérations pour les nœuds masters et NotReady
    kyverno_tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
  block:
    # --- Namespace Kyverno ---
    - name: Ensure kyverno namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kyverno_namespace }}"
      when: inventory_hostname == groups['masters'][0]
      tags: kyverno

    # --- Helm repo ---
    - name: Add Kyverno Helm repo
      kubernetes.core.helm_repository:
        name: kyverno
        repo_url: https://kyverno.github.io/kyverno/
      environment:
        K8S_AUTH_KUBECONFIG: /root/.kube/config
        KUBECONFIG: /root/.kube/config
      when: inventory_hostname == groups['masters'][0]
      tags: kyverno

    # --- Installation Kyverno (sur les masters uniquement) ---
    - name: Install/upgrade Kyverno (with proxy + hostNetwork + nodeSelector + tolerations)
      kubernetes.core.helm:
        name: kyverno
        chart_ref: kyverno/kyverno
        release_namespace: "{{ kyverno_namespace }}"
        wait: false
        atomic: false
        create_namespace: false
        chart_version: "{{ kyverno_version }}"
        values:
          installCRDs: true
          global:
            imageRegistry: "{{ nfq_proxy_host }}"
          # Configuration commune à tous les composants
          nodeSelector: "{{ kyverno_node_selector }}"
          tolerations: "{{ kyverno_tolerations }}"
          # Configuration spécifique par composant
          backgroundController:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector: "{{ kyverno_node_selector }}"
            tolerations: "{{ kyverno_tolerations }}"
          admissionController:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector: "{{ kyverno_node_selector }}"
            tolerations: "{{ kyverno_tolerations }}"
          reportsController:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            tolerations: "{{ kyverno_tolerations }}"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
          cleanupController:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector: "{{ kyverno_node_selector }}"
            tolerations: "{{ kyverno_tolerations }}"
          # Configuration pour migrate-resources (daemonset)
          migrateResources:
            enabled: true
            tolerations: "{{ kyverno_tolerations }}"
            nodeSelector: "{{ kyverno_node_selector }}"
      environment:
        K8S_AUTH_KUBECONFIG: /root/.kube/config
        KUBECONFIG: /root/.kube/config
      when: inventory_hostname == groups['masters'][0]
      tags: kyverno

    # --- Attente des CRDs ---
    - name: Wait for Kyverno CRD clusterpolicies.kyverno.io to exist
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusterpolicies.kyverno.io
      register: kyverno_crd
      until: kyverno_crd.resources | length > 0
      retries: 30
      delay: 2
      when: inventory_hostname == groups['masters'][0]
      tags: kyverno

    # --- Kyverno Policies Bundle (sur les masters uniquement) ---
    - name: Optionally install kyverno-policies bundle
      when:
        - kyverno_install_policies | bool
        - inventory_hostname == groups['masters'][0]
      kubernetes.core.helm:
        name: kyverno-policies
        chart_ref: kyverno/kyverno-policies
        release_namespace: "{{ kyverno_namespace }}"
        wait: false
        values:
          global:
            imageRegistry: "{{ nfq_proxy_host }}"
          nodeSelector: "{{ kyverno_node_selector }}"
          tolerations: "{{ kyverno_tolerations }}"
      environment:
        K8S_AUTH_KUBECONFIG: /root/.kube/config
        KUBECONFIG: /root/.kube/config
      tags: kyverno

    # --- Policy: Restrict Image Registries ---
    - name: Apply ClusterPolicy restrict-image-registries
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'templates/policies/restrict-image-registries.yaml.j2') | from_yaml }}"
      when:
        - inventory_hostname == groups['masters'][0]
        - kyverno_enforce | bool
      tags: kyverno

    # --- Policy: Prepend Image Registry (safe version) ---
    - name: Apply ClusterPolicy prepend-image-registry (safe merge)
      when:
        - kyverno_mutate_prepend | bool
        - inventory_hostname == groups['masters'][0]
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'templates/policies/prepend-image-registry.yaml.j2') | from_yaml }}"
      tags: kyverno

    # --- PolicyException: Allow Kyverno to use hostNetwork / hostPorts ---
    - name: Apply PolicyException to allow Kyverno hostNetwork and hostPorts
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kyverno.io/v2
          kind: PolicyException
          metadata:
            name: allow-kyverno-self-hostnetwork
            namespace: "{{ kyverno_namespace }}"
          spec:
            match:
              any:
                - resources:
                    namespaces:
                      - "{{ kyverno_namespace }}"
            exceptions:
              - policyName: disallow-host-namespaces
                ruleNames:
                  - "*"
                  - autogen-host-namespaces
                  - host-namespaces
              - policyName: disallow-host-ports
                ruleNames:
                  - "*"
                  - autogen-host-ports
                  - host-ports-none
      when: inventory_hostname == groups['masters'][0]
      tags: kyverno
  tags: kyverno
