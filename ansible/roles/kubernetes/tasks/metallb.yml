---
# Variables attendues (exemples à mettre dans group_vars/all.yml)
# metallb_namespace: "metallb-system"
# metallb_version: "0.13.12"
# nfq_proxy_host: "192.168.200.1:8000"
#
# Optionnel : définir les pools si tu veux les créer automatiquement
# metallb_pools:
#   - name: default
#     addresses:
#       - "192.168.200.240-192.168.200.250"
#     autoL2Adv: true   # si true, on génère aussi un L2Advertisement pour ce pool

- name: Add MetalLB Helm repo
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: https://metallb.github.io/metallb
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, helm]

- name: Ensure namespace {{ metallb_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata: { name: "{{ metallb_namespace }}" }
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, ns]

# Installation MetalLB via Helm
# - wait=false pour éviter de bloquer si le CNI n'est pas encore up
# - on préfixe toutes les images via le proxy tampon
# - on conserve les repositories d’origine (Kyverno peut aussi préprépender si besoin)
- name: Install/upgrade MetalLB (Helm)
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    release_namespace: "{{ metallb_namespace }}"
    create_namespace: false
    chart_version: "{{ metallb_version }}"
    wait: false
    atomic: false
    values:
      global:
        imageRegistry: "{{ nfq_proxy_host }}"
      controller:
        image:
          repository: "quay.io/metallb/controller"
      speaker:
        image:
          repository: "quay.io/metallb/speaker"
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, helm]

# (léger) Wait: s’assurer que les objets existent (sans exiger Ready)
- name: Wait until metallb controller Deployment exists
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ metallb_namespace }}"
    name: controller
  register: mlb_ctrl
  until: mlb_ctrl.resources | length > 0
  retries: 60
  delay: 5
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, check]

# (Optionnel) CRs IPAddressPool + L2Advertisement
- name: Apply IPAddressPool(s)
  when: metallb_pools is defined and metallb_pools | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ metallb_namespace }}"
      spec:
        addresses: "{{ item.addresses }}"
  loop: "{{ metallb_pools }}"
  loop_control: { label: "{{ item.name }}" }
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, pools]

- name: Apply L2Advertisement(s) for pools with autoL2Adv=true
  when: metallb_pools is defined and (metallb_pools | selectattr('autoL2Adv','defined') | list | length) > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: "l2adv-{{ item.name }}"
        namespace: "{{ metallb_namespace }}"
      spec:
        ipAddressPools:
          - "{{ item.name }}"
  loop: "{{ metallb_pools | selectattr('autoL2Adv', 'defined') | selectattr('autoL2Adv') | list }}"
  loop_control: { label: "{{ item.name }}" }
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, pools]

# Debug non bloquant
- name: List MetalLB pods (debug)
  command: kubectl -n {{ metallb_namespace }} get pods -o wide
  register: metallb_pods
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ groups['masters'][0] }}"
  become: yes
  environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
  tags: [metallb, check]
