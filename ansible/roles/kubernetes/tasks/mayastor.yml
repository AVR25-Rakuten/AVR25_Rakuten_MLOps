# Variables pour Mayastor
- name: Configure Mayastor storage
  vars:
    mayastor_namespace: "openebs"
    mayastor_chart_version: "4.3.3"
    data_node_group: "datas"                 # groupe Ansible de tes nœuds storage
    mayastor_disk_device_default: "/dev/nvme0n2"
    # Variables pour Kyverno
    kyverno_namespace: "kyverno"
    kyverno_extra_args: "--webhookServerHost=0.0.0.0"
  block:
    # --- Correction de Kyverno pour le webhook ---
    - name: Mettre à jour Kyverno pour écouter sur 0.0.0.0:9443
      block:
        - name: Récupérer les valeurs actuelles de Kyverno
          command: helm get values kyverno -n {{ kyverno_namespace }}
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
          register: kyverno_current_values
          ignore_errors: yes
          tags: [kyverno, webhook]

        - name: Définir les nouvelles valeurs pour Kyverno
          set_fact:
            kyverno_values: |
              admissionController:
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                webhookServer:
                  port: 9443
                extraArgs:
                  - {{ kyverno_extra_args }}
          tags: [kyverno, webhook]

        - name: Créer un fichier temporaire pour les valeurs Kyverno
          copy:
            dest: "/tmp/kyverno-values.yaml"
            content: "{{ kyverno_values }}"
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          tags: [kyverno, webhook]

        - name: Mettre à jour Kyverno avec Helm
          kubernetes.core.helm:
            name: kyverno
            namespace: "{{ kyverno_namespace }}"
            chart_ref: kyverno/kyverno
            values_files: "/tmp/kyverno-values.yaml"
            state: present
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
          tags: [kyverno, webhook]

        - name: Vérifier que Kyverno écoute sur 0.0.0.0:9443
          shell: ss -tulnp | grep 9443 || true
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          register: kyverno_listen_check
          tags: [kyverno, webhook]

        - name: Afficher le statut de l'écoute de Kyverno
          debug:
            var: kyverno_listen_check.stdout_lines
          tags: [kyverno, webhook]

        - name: Tester la connectivité au webhook Kyverno
          uri:
            url: "https://192.168.200.11:9443/readyz"
            validate_certs: no
            method: GET
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          register: kyverno_health_check
          ignore_errors: yes
          tags: [kyverno, webhook]

        - name: Afficher le résultat du test de connectivité
          debug:
            var: kyverno_health_check.status
          tags: [kyverno, webhook]
      tags: [kyverno, webhook]

    # --- Nettoyage des ressources existantes Mayastor ---
    - name: Nettoyer les ressources Mayastor existantes
      block:
        - name: Supprimer la release Helm Mayastor
          command: helm uninstall mayastor -n {{ mayastor_namespace }}
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
          ignore_errors: yes
          tags: [mayastor, cleanup]

        - name: Supprimer le namespace OpenEBS
          kubernetes.core.k8s:
            state: absent
            definition:
              apiVersion: v1
              kind: Namespace
              metadata: { name: "{{ mayastor_namespace }}" }
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
          ignore_errors: yes
          tags: [mayastor, cleanup]

        - name: Supprimer le dépôt Helm OpenEBS
          command: helm repo remove openebs
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          ignore_errors: yes
          tags: [mayastor, cleanup]
      tags: [mayastor, cleanup]

    # --- Prérequis OS sur les nœuds data ---
    - name: Vérifier le kernel >= 5.13
      shell: |
        cur=$(uname -r | cut -d- -f1)
        printf "5.13\n%s\n" "$cur" | sort -C -V
      register: kernelchk
      failed_when: kernelchk.rc != 0
      changed_when: false
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor]

    - name: Installer nvme-cli
      package:
        name: nvme-cli
        state: present
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor]

    - name: Charger le module nvme_tcp
      modprobe:
        name: nvme_tcp
        state: present
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor]

    - name: Persister nvme_tcp au boot
      copy:
        dest: /etc/modules-load.d/nvme_tcp.conf
        content: "nvme_tcp\n"
        mode: "0644"
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor]

    - name: Configurer HugePages (2MiB x 2048 = 4GiB réservés)
      sysctl:
        name: vm.nr_hugepages
        value: "2048"
        sysctl_set: true
        reload: true
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor]

    # --- Labels OpenEBS sur les nœuds data ---
    - name: Labeliser les nœuds data pour OpenEBS/Mayastor
      command: kubectl label node {{ item }} openebs.io/engine=mayastor openebs.io/csi-node=mayastor openebs.io/storage=mayastor --overwrite
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      loop: "{{ groups[data_node_group] | default([]) }}"
      when: groups[data_node_group] is defined
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor]

    # --- Namespace & repo Helm ---
    - name: Ensure namespace {{ mayastor_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata: { name: "{{ mayastor_namespace }}" }
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [mayastor, helm]

    - name: Add OpenEBS Helm repo (v4+)
      kubernetes.core.helm_repository:
        name: openebs
        repo_url: https://openebs.github.io/openebs
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [mayastor, helm]

    - name: Mettre à jour le dépôt Helm
      command: helm repo update
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [mayastor, helm]

    - name: Désactiver temporairement Kyverno (si nécessaire)
      command: kubectl delete validatingwebhookconfigurations kyverno-policy-validating-webhook-cfg mutatingwebhookconfigurations kyverno-policy-mutating-webhook-cfg --ignore-not-found
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [mayastor, helm]

    - name: Construire les valeurs OpenEBS/Mayastor (4.3.3, option A)
      set_fact:
        openebs_values:
          # Observability off
          alloy:
            enabled: false
          loki:
            enabled: false
          # Moteurs locaux non utilisés
          engines:
            local:
              lvm:
                enabled: false
              zfs:
                enabled: false
            replicated:
              mayastor:
                enabled: true
          # Mayastor : topologie + tolerations
          mayastor:
            csi:
              node:
                topology:
                  nodeSelector: true
                  segments:
                    openebs.io/csi-node: "mayastor"
                tolerations:
                  - key: "node-role.kubernetes.io/data"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"
            io_engine:
              tolerations:
                - key: "node-role.kubernetes.io/data"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"
            agents:
              ha:
                enabled: true
                node:
                  logLevel: "info"
                  resources:
                    limits:
                      cpu: "500m"
                      memory: "512Mi"
                    requests:
                      cpu: "100m"
                      memory: "128Mi"
              core:
                tolerations:
                  - key: "node-role.kubernetes.io/data"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"
              ha:
                node:
                  tolerations:
                    - key: "node-role.kubernetes.io/data"
                      operator: "Equal"
                      value: "true"
                      effect: "NoSchedule"
                cluster:
                  tolerations:
                    - key: "node-role.kubernetes.io/data"
                      operator: "Equal"
                      value: "true"
                      effect: "NoSchedule"
      tags: [mayastor, helm]

    # --- Générer les fichiers de configuration ---
    - name: Créer le répertoire pour les fichiers générés
      file:
        path: "/tmp/mayastor-manifests"
        state: directory
        mode: "0755"
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      tags: [mayastor, generate]

    - name: Créer un fichier temporaire pour les valeurs YAML
      copy:
        dest: "/tmp/mayastor-values.yaml"
        content: |
          {{ openebs_values | to_nice_yaml }}
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      tags: [mayastor, generate]

    - name: Générer les fichiers de configuration avec Helm template
      shell: helm template mayastor openebs/openebs --version {{ mayastor_chart_version }} --namespace {{ mayastor_namespace }} -f /tmp/mayastor-values.yaml > /tmp/mayastor-manifests/mayastor.yaml
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [mayastor, generate]

    - name: Vérifier si le fichier est généré
      stat:
        path: "/tmp/mayastor-manifests/mayastor.yaml"
      register: file_stat
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      tags: [mayastor, generate]

    - name: Afficher le statut du fichier
      debug:
        var: file_stat
      tags: [mayastor, generate]

    - name: Afficher le contenu des fichiers générés
      command: ls /tmp/mayastor-manifests/mayastor.yaml
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      register: generated_manifests
      changed_when: false
      tags: [mayastor, generate]
