---
- name: Hard-stop APT and free locks (fast mode)
  block:
    - name: Stop & mask apt services/timers
      systemd:
        name: "{{ item }}"
        state: stopped
        masked: yes
        enabled: no
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service
      ignore_errors: yes
    - name: Kill any lingering apt/dpkg processes
      shell: |
        pgrep -f 'apt.systemd.daily|unattended-upgrade|apt-get|aptitude|dpkg' | xargs -r kill -9
      changed_when: false
      failed_when: false
    - name: Remove dpkg/apt lock files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/dpkg/lock-frontend
        - /var/lib/dpkg/lock
        - /var/cache/apt/archives/lock
      changed_when: false
      failed_when: false
    - name: Quickly fix half-configured packages
      environment:
        DEBIAN_FRONTEND: noninteractive
      shell: |
        dpkg --configure -a || true
      changed_when: false
      failed_when: false
  tags: install



# Tâche Ansible pour configurer Mayastor (OpenEBS) sur des nœuds de données — sans resolve by-id
- name: Mayastor NVMe-only — déploiement complet avec core.helm
  vars:
    mayastor_namespace: openebs
    data_node_group: datas
    mayastor_disk_device_default: "/dev/nvme0n2"   # chemin bloqué /dev/... passé en variable
    taint_data_nodes: true
    set_default_sc: true
    default_sc_name: mayastor-3
    enable_snapshot_crds: true           # désactive-le si ton cluster fournit déjà les CRDs de VolumeSnapshot
    kernel_min_version: "5.15.0"           # requis NVMe/TCP stable pour Mayastor
    hugepages_count: 2048                # 2048 x 2MiB = 4GiB

  block:
    ###########################################################################
    # 0) PRÉREQUIS NVMe/TCP SUR LES NŒUDS QUI MONTERONT LES VOLUMES (ici: data)
    ###########################################################################
    # - name: Check kernel >= {{ kernel_min_version }} (requis NVMe/TCP)
    #   shell: |
    #     set -euo pipefail
    #     cur=$(uname -r | cut -d- -f1)
    #     printf "%s\n%s\n" "{{ kernel_min_version }}" "$cur" | sort -C -V
    #   register: kernelchk
    #   failed_when: kernelchk.rc != 0
    #   changed_when: false
    #   when: inventory_hostname in groups[data_node_group]
    #   tags: [mayastor, storage, nvme, csi]

    - name: Install nvme-cli (utile mais optionnel)
      package:
        name: nvme-cli
        state: present
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor, storage, nvme, csi]

    - name: Load nvme_tcp module now
      modprobe:
        name: nvme_tcp
        state: present
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor, storage, nvme, csi]

    - name: Persist nvme_tcp at boot
      copy:
        dest: /etc/modules-load.d/nvme_tcp.conf
        content: "nvme_tcp\n"
        mode: "0644"
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor, storage, nvme, csi]

    ###########################################################################
    # 1) PRÉPA DES NŒUDS DATA (HugePages, labels/taints)
    ###########################################################################
    - name: Ensure HugePages
      sysctl:
        name: vm.nr_hugepages
        value: "{{ hugepages_count | string }}"
        sysctl_set: true
        reload: true
      when: inventory_hostname in groups[data_node_group]
      register: hugepages_result
      tags: [mayastor, storage, nvme, csi]

    - name: Restart kubelet if HugePages changed
      service:
        name: kubelet
        state: restarted
      when:
        - inventory_hostname in groups[data_node_group]
        - hugepages_result is changed
      tags: [mayastor, storage, nvme, csi]

    - name: Label node for Mayastor (role data)
      command: kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/data=true --overwrite
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: label_ms
      changed_when: "'labeled' in (label_ms.stdout + label_ms.stderr) or 'configured' in (label_ms.stdout + label_ms.stderr)"
      when: inventory_hostname in groups[data_node_group]
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [mayastor, storage, nvme, csi]

    - name: Label node for CSI topology
      command: kubectl label node {{ inventory_hostname }} openebs.io/csi-node=mayastor --overwrite
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: label_csi
      changed_when: "'labeled' in (label_csi.stdout + label_csi.stderr) or 'configured' in (label_csi.stdout + label_csi.stderr)"
      when: inventory_hostname in groups[data_node_group]
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [mayastor, storage, nvme, csi]

    - name: Label node for Mayastor IO engine
      command: kubectl label node {{ inventory_hostname }} openebs.io/engine=mayastor --overwrite
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: label_engine
      changed_when: "'labeled' in (label_engine.stdout + label_engine.stderr) or 'configured' in (label_engine.stdout + label_engine.stderr)"
      when: inventory_hostname in groups[data_node_group]
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [mayastor, storage, nvme, csi]

    - name: Label node for "storage" visibility
      command: kubectl label node {{ inventory_hostname }} openebs.io/storage=mayastor --overwrite
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: label_storage
      changed_when: "'labeled' in (label_storage.stdout + label_storage.stderr) or 'configured' in (label_storage.stdout + label_storage.stderr)"
      when: inventory_hostname in groups[data_node_group]
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [mayastor, storage, nvme, csi]

    - name: (Optionnel recommandé) Taint DATA nodes
      command: kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/data=true:NoSchedule --overwrite
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: taint_out
      changed_when: "'tainted' in (taint_out.stdout + taint_out.stderr) or 'already has' in (taint_out.stdout + taint_out.stderr)"
      when:
        - taint_data_nodes
        - inventory_hostname in groups[data_node_group]
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [mayastor, storage, nvme, csi]

    - name: "Guard - ensure device looks like a block path"
      vars:
        dev: "{{ hostvars[inventory_hostname].mayastor_disk_device | default(mayastor_disk_device_default) }}"
      assert:
        that:
          - dev is match('^/dev/.+')
        fail_msg: "mayastor_disk_device doit être un chemin /dev/..."
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor, storage, nvme, csi]

    - name: (DANGEREUX) Wipe du disque NVMe dédié (sans resolve, utilise la variable telle quelle)
      vars:
        dev: "{{ hostvars[inventory_hostname].mayastor_disk_device | default(mayastor_disk_device_default) }}"
      ansible.builtin.shell: |
        set -euo pipefail
        wipefs -a "{{ dev }}"
        sgdisk --zap-all "{{ dev }}" || true
        udevadm settle || true
      args:
        executable: /bin/bash
      when: inventory_hostname in groups[data_node_group]
      tags: [mayastor, storage, nvme, csi]

    ###########################################################################
    # 2) INSTALL OPENEBS (MAYASTOR UNIQUEMENT) + topo CSI / tolerations
    ###########################################################################
    - name: Add OpenEBS helm repo
      kubernetes.core.helm_repository:
        name: openebs
        repo_url: "https://openebs.github.io/openebs"
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    - name: Create namespace {{ mayastor_namespace }}
      kubernetes.core.k8s:
        name: "{{ mayastor_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    - name: Install/upgrade OpenEBS with Mayastor only (NVMe) + corrected values
      kubernetes.core.helm:
        name: openebs
        chart_ref: openebs/openebs
        release_namespace: "{{ mayastor_namespace }}"
        create_namespace: true
        wait: true
        values:
          engines:
            local:
              lvm:
                enabled: false
              zfs:
                enabled: false
            replicated:
              mayastor:
                enabled: true

          # Composants annexes désactivés
          alloy:
            enabled: false
          loki:
            enabled: false

          # CRDs VolumeSnapshot (désactive si déjà présents dans le cluster)
          openebs-crds:
            csi:
              volumeSnapshots:
                enabled: "{{ enable_snapshot_crds }}"
                keep: true

          mayastor:
            # Placement par défaut pour tous les composants Mayastor
            base:
              nodeSelector:
                node-role.kubernetes.io/data: "true"
              tolerations:
                - key: "node-role.kubernetes.io/data"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"

            # CSI
            csi:
              controller:
                enabled: true
                nodeSelector:
                  node-role.kubernetes.io/data: "true"
                tolerations:
                  - key: "node-role.kubernetes.io/data"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"
              node:
                enabled: true
                nodeSelector:
                  node-role.kubernetes.io/data: "true"
                tolerations:
                  - key: "node-role.kubernetes.io/data"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"
                topology:
                  nodeSelector: true
                  segments:
                    openebs.io/csi-node: mayastor

            # Agents
            agents:
              core:
                enabled: true
                nodeSelector:
                  node-role.kubernetes.io/data: "true"
                tolerations:
                  - key: "node-role.kubernetes.io/data"
                    operator: "Equal"
                    value: "true"
                    effect: "NoSchedule"

            # Data plane
            io_engine:
              enabled: true
              nodeSelector:
                node-role.kubernetes.io/data: "true"
              tolerations:
                - key: "node-role.kubernetes.io/data"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    - name: Wait for DiskPool CRD to be established
      shell: kubectl get crd diskpools.openebs.io
      register: crd
      retries: 30
      delay: 5
      until: crd.rc == 0
      changed_when: false
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    ###########################################################################
    # 3) DISKPOOLS (UN PAR NŒUD DATA) — v1beta3 (utilise le chemin /dev/… fourni)
    ###########################################################################
    - name: Create DiskPool for each DATA node
      vars:
        target_dev: "{{ hostvars[item].mayastor_disk_device | default(mayastor_disk_device_default) }}"
        pool_definition:
          apiVersion: openebs.io/v1beta3
          kind: DiskPool
          metadata:
            name: pool-{{ item }}
            namespace: "{{ mayastor_namespace }}"
          spec:
            node: "{{ item }}"
            disks:
              - "{{ target_dev }}"
      kubernetes.core.k8s:
        state: present
        definition: "{{ pool_definition }}"
      loop: "{{ groups[data_node_group] | default([]) }}"
      when:
        - inventory_hostname == groups['masters'][0]
        - groups[data_node_group] is defined
        - groups[data_node_group] | length > 0
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    ###########################################################################
    # 4) STORAGECLASSES (NVMe/TCP, RWO)
    ###########################################################################
    - name: Create SC mayastor-1 and mayastor-3
      kubernetes.core.k8s:
        state: present
        definition: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: mayastor-1
          provisioner: io.openebs.csi-mayastor
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            protocol: nvmf
            repl: "1"
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: mayastor-3
          provisioner: io.openebs.csi-mayastor
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            protocol: nvmf
            repl: "3"
            thin: "true"
            ioTimeout: "30"
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi]

    - name: Optionally set default StorageClass
      when:
        - set_default_sc
        - inventory_hostname == groups['masters'][0]
      block:
        - name: Remove default annotation from other SCs
          shell: |
            set -e
            for sc in $(kubectl get sc -o jsonpath='{.items[*].metadata.name}'); do
              if [ "$sc" != "{{ default_sc_name }}" ]; then
                kubectl annotate sc "$sc" storageclass.kubernetes.io/is-default-class- || true
              fi
            done
          environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
          delegate_to: "{{ groups['masters'][0] }}"
          run_once: true
          tags: [mayastor, storage, nvme, csi]

        - name: Check if {{ default_sc_name }} is already default
          command: kubectl get sc {{ default_sc_name }} -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}'
          register: sc_default
          changed_when: false
          failed_when: false
          environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
          delegate_to: "{{ groups['masters'][0] }}"
          run_once: true
          tags: [mayastor, storage, nvme, csi]

        - name: Annotate {{ default_sc_name }} as default
          command: kubectl annotate sc {{ default_sc_name }} storageclass.kubernetes.io/is-default-class="true" --overwrite
          register: annotate_out
          changed_when: "'annotated' in (annotate_out.stdout | default('')) or 'annotated' in (annotate_out.stderr | default(''))"
          when: sc_default.stdout | default('') != 'true'
          environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
          delegate_to: "{{ groups['masters'][0] }}"
          run_once: true
          tags: [mayastor, storage, nvme, csi]

    ###########################################################################
    # 5) MANIFEST DE TEST (PVC + BUSYBOX)
    ###########################################################################
    - name: Create test PVC and busybox pod
      kubernetes.core.k8s:
        state: present
        definition: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: test-namespace
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: test-pvc
            namespace: test-namespace
          spec:
            accessModes: [ "ReadWriteOnce" ]
            storageClassName: mayastor-3
            resources:
              requests:
                storage: 5Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-busybox
            namespace: test-namespace
          spec:
            containers:
            - name: busybox
              image: busybox
              command: ['sh', '-c', 'echo "Hello, Mayastor!" > /mnt/test.txt && sleep 3600']
              volumeMounts:
              - name: test-volume
                mountPath: /mnt
            volumes:
            - name: test-volume
              persistentVolumeClaim:
                claimName: test-pvc
            nodeSelector:
              node-role.kubernetes.io/data: "true"
            tolerations:
              - key: "node-role.kubernetes.io/data"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
      when: inventory_hostname == groups['masters'][0]
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      tags: [mayastor, storage, nvme, csi, test]

  become: yes
  tags: [mayastor, storage, nvme, csi]


# --- RESTORE MODE: réactiver APT/Dpkg auto après l'install ---
- name: Re-enable APT services/timers (restore mode)
  block:
    - name: Unmask apt services/timers
      systemd:
        name: "{{ item }}"
        masked: no
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service
      ignore_errors: yes
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
    - name: Enable & start apt timers
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      ignore_errors: yes
    - name: Enable & start unattended-upgrades
      systemd:
        name: unattended-upgrades
        enabled: yes
        state: started
      ignore_errors: yes
  tags: install
