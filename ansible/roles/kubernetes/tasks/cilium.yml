# Tâche Ansible — Cilium en 4 phases : réseau, KPR, Hubble, L2/LB-IPAM
- name: Cilium — Déploiement progressif
  vars:
    kube_system_ns: "kube-system"
    cilium_version: "1.18.2"
    cilium_values_file: "/etc/cilium/values-selectors.yaml"
    use_values_file: false
    enable_kpr: true
    remove_kube_proxy: true
    enable_hubble: true
    enable_hubble_ui: true
    # Plage LB-IPAM (à adapter)
    lb_ipam_blocks:
      - start: "192.168.200.100"
        stop:  "192.168.200.120"
    # Optionnel : IP fixe pour Hubble UI
    hubble_ui_lb_ip: ""
    # Sélecteurs et tolérations pour les nœuds réseau
    network_node_selector:
      "node-role.kubernetes.io/network": "true"
    network_tolerations:
      - key: "node-role.kubernetes.io/network"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/data"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoSchedule"
  block:
    # ===========================================================================
    # 0) PRÉPARATION — Découverte de l'API Kubernetes
    # ===========================================================================
    - name: Récupérer l'adresse de l'API Kubernetes
      command: >
        kubectl -n default get endpoints kubernetes
        -o jsonpath='{.subsets[0].addresses[0].ip}:{.subsets[0].ports[0].port}'
      register: api_hostport
      changed_when: false
      failed_when: api_hostport.rc != 0 or api_hostport.stdout == ""
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      tags: [cilium]
    - name: Définir les faits pour Cilium (API host/port)
      set_fact:
        cilium_api_host: "{{ api_hostport.stdout.split(':')[0] }}"
        cilium_api_port: "{{ api_hostport.stdout.split(':')[1] | default('6443') }}"
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      delegate_facts: true
      tags: [cilium]
    - name: Attendre que l'API Kubernetes soit accessible
      command: kubectl --request-timeout=5s get --raw='/version'
      register: api_ping
      retries: 60
      delay: 5
      until: api_ping.rc == 0
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      tags: [cilium]
    # ===========================================================================
    # 0.bis) VÉRIFICATION DU FICHIER DE VALEURS HELM (optionnel)
    # ===========================================================================
    - name: Vérifier l'existence du fichier de valeurs Cilium
      when: use_values_file | default(false) | bool
      ansible.builtin.stat:
        path: "{{ cilium_values_file }}"
      register: cilium_values_stat
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      tags: [cilium]
    # ===========================================================================
    # 1) INSTALLATION DE CILIUM — Phase 1 : Réseau de base
    # ===========================================================================
    - name: Ajouter le dépôt Helm de Cilium
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/
        state: present
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      tags: [cilium]
    - name: Déboguer les variables
      debug:
        msg: "use_values_file: {{ use_values_file }}, cilium_values_stat: {{ cilium_values_stat | default({}) }}"
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      tags: [cilium]
    - name: Installer Cilium (sans KPR, images gérées par Kyverno)
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: "{{ kube_system_ns }}"
        chart_version: "{{ cilium_version }}"
        create_namespace: false
        wait: true
        atomic: true
        timeout: 10m
        values_files: >
          {{ [cilium_values_file] if use_values_file | bool else [] }}
        values:
          # NOTE: Les images ne sont PAS spécifiées ici — Kyverno les préfixe automatiquement
          operator:
            nodeSelector: "{{ network_node_selector }}"
            tolerations: "{{ network_tolerations }}"
          hubble:
            relay:
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
            ui:
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
          kubeProxyReplacement: false
          ipam:
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList: "10.244.0.0/16"
              clusterPoolIPv4MaskSize: 24
      register: cilium_install_phase1
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    - name: Attendre que cilium-agent soit prêt (phase 1)
      command: kubectl -n {{ kube_system_ns }} rollout status ds/cilium --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    - name: Attendre que cilium-operator soit prêt (phase 1)
      command: kubectl -n {{ kube_system_ns }} rollout status deploy/cilium-operator --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    # ===========================================================================
    # 2) MISE À JOUR CILIUM — Phase 2 : Activation du KPR (kube-proxy replacement)
    # ===========================================================================
    - name: Mettre à jour Cilium avec KPR et L2 announcements
      when: enable_kpr | bool
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: "{{ kube_system_ns }}"
        chart_version: "{{ cilium_version }}"
        wait: true
        atomic: true
        timeout: 10m
        values_files: >
          {{ [cilium_values_file] if use_values_file | bool else [] }}
        values:
          # NOTE: Les images ne sont PAS spécifiées ici — Kyverno les préfixe automatiquement
          operator:
            nodeSelector: "{{ network_node_selector }}"
            tolerations: "{{ network_tolerations }}"
          hubble:
            relay:
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
            ui:
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
          kubeProxyReplacement: true
          k8sServiceHost: "{{ hostvars[groups['masters'][0]].cilium_api_host }}"
          k8sServicePort: "{{ hostvars[groups['masters'][0]].cilium_api_port }}"
          bpf:
            masquerade: true
          l2announcements:
            enabled: true
          k8sClientRateLimit:
            qps: 50
            burst: 100
          defaultLBServiceIPAM: "none"
      register: cilium_upgrade_kpr
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    - name: Attendre que cilium-agent soit prêt (KPR)
      when: enable_kpr | bool
      command: kubectl -n {{ kube_system_ns }} rollout status ds/cilium --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    - name: Attendre que cilium-operator soit prêt (KPR)
      when: enable_kpr | bool
      command: kubectl -n {{ kube_system_ns }} rollout status deploy/cilium-operator --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium]
    - name: Supprimer kube-proxy (si activé)
      when: enable_kpr | bool and remove_kube_proxy | bool
      block:
        - name: Supprimer le DaemonSet kube-proxy
          command: kubectl -n kube-system delete ds kube-proxy --ignore-not-found=true
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
        - name: Supprimer le ConfigMap kube-proxy
          command: kubectl -n kube-system delete cm kube-proxy --ignore-not-found=true
          run_once: true
          delegate_to: "{{ groups['masters'][0] }}"
          become: yes
          environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
        - name: Nettoyer les règles iptables KUBE*
          ansible.builtin.shell: |
            set -euo pipefail
            iptables-save | grep -v KUBE | iptables-restore
          args:
            executable: /bin/bash
          become: yes
      tags: [cilium]
    # ===========================================================================
    # 3) ACTIVATION DE HUBBLE — Phase 3 : Observabilité
    # ===========================================================================
    - name: Activer Hubble Relay
      when: enable_hubble | bool
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: "{{ kube_system_ns }}"
        chart_version: "{{ cilium_version }}"
        wait: true
        timeout: 10m
        values_files: >
          {{ [cilium_values_file] if use_values_file | bool else [] }}
        values:
          # NOTE: Les images ne sont PAS spécifiées ici — Kyverno les préfixe automatiquement
          operator:
            nodeSelector: "{{ network_node_selector }}"
            tolerations: "{{ network_tolerations }}"
          hubble:
            relay:
              enabled: true
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
            ui:
              enabled: "{{ enable_hubble_ui | bool }}"
              nodeSelector: "{{ network_node_selector }}"
              tolerations: "{{ network_tolerations }}"
          kubeProxyReplacement: true
          k8sServiceHost: "{{ hostvars[groups['masters'][0]].cilium_api_host }}"
          k8sServicePort: "{{ hostvars[groups['masters'][0]].cilium_api_port }}"
          bpf:
            masquerade: true
          l2announcements:
            enabled: true
          k8sClientRateLimit:
            qps: 50
            burst: 100
          defaultLBServiceIPAM: "none"
          ipam:
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList: "10.244.0.0/16"
              clusterPoolIPv4MaskSize: 24
      register: hubble_relay_enable
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, hubble]
    - name: Attendre que hubble-relay soit prêt
      when: enable_hubble | bool
      command: kubectl -n {{ kube_system_ns }} rollout status deploy/hubble-relay --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, hubble]
    - name: Attendre que Hubble UI soit prêt (si activé)
      when: enable_hubble | bool and enable_hubble_ui | bool
      command: kubectl -n {{ kube_system_ns }} rollout status deploy/hubble-ui --timeout=600s
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, hubble]
    # ===========================================================================
    # 4) CONFIGURATION L2 ET LB-IPAM — Phase 4 : Load Balancing
    # ===========================================================================
    - name: Définir le pool LB-IPAM
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: "cilium.io/v2"
          kind: CiliumLoadBalancerIPPool
          metadata:
            name: "lb-pool"
          spec:
            blocks: "{{ lb_ipam_blocks }}"
            serviceSelector:
              matchExpressions:
                - key: expose
                  operator: In
                  values: ["l2"]
                - key: io.kubernetes.service.namespace
                  operator: In
                  values: ["{{ kube_system_ns }}"]
                - key: io.kubernetes.service.name
                  operator: In
                  values: ["hubble-ui-lb"]
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, l2]
    - name: Créer la politique d'annonces L2
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: "cilium.io/v2alpha1"
          kind: CiliumL2AnnouncementPolicy
          metadata:
            name: "l2-default"
          spec:
            nodeSelector:
              matchLabels:
                "node-role.kubernetes.io/network": "true"
            interfaces:
              - "^enp3s0"  # Remplacer par le nom de votre interface réseau
            loadBalancerIPs: true
            externalIPs: true
            tolerations: "{{ network_tolerations }}"
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, l2]
    - name: Créer le Service LoadBalancer pour Hubble UI
      block:
        - name: Vérifier que le Service hubble-ui existe
          command: kubectl -n {{ kube_system_ns }} get svc hubble-ui
          register: hubble_ui_svc_exists
          retries: 30
          delay: 5
          until: hubble_ui_svc_exists.rc == 0
          changed_when: false
        - name: Récupérer la définition du Service hubble-ui
          command: kubectl -n {{ kube_system_ns }} get svc hubble-ui -o json
          register: hubble_ui_svc_json
          changed_when: false
        - name: Définir le sélecteur de Hubble UI
          set_fact:
            hubble_ui_selector: "{{ (hubble_ui_svc_json.stdout | from_json).spec.selector }}"
        - name: Créer le Service LoadBalancer pour Hubble UI
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: hubble-ui-lb
                namespace: "{{ kube_system_ns }}"
                annotations: >
                  {{ {'lbipam.cilium.io/ips': hubble_ui_lb_ip}
                     if (hubble_ui_lb_ip | length) > 0
                     else {} }}
                labels:
                  app.kubernetes.io/part-of: "cilium"
                  app.kubernetes.io/name: "hubble-ui"
                  expose: "l2"
              spec:
                type: LoadBalancer
                loadBalancerClass: io.cilium/l2-announcer
                selector: "{{ hubble_ui_selector | default({'k8s-app':'hubble-ui'}) }}"
                ports:
                  - name: http
                    port: 80
                    targetPort: 8081
        - name: Attendre l'attribution d'une IP externe
          shell: >
            kubectl -n {{ kube_system_ns }} get svc hubble-ui-lb
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
          register: hubble_ui_lb_ip_alloc
          retries: 60
          delay: 5
          until: hubble_ui_lb_ip_alloc.stdout != ""
          changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      become: yes
      environment: { KUBECONFIG: "/etc/kubernetes/admin.conf" }
      tags: [cilium, l2, hubble]
    # ===========================================================================
    # 5) VÉRIFICATIONS FINALES
    # ===========================================================================
    - name: Vérifier que L2 est activé sur l'agent Cilium
      command: kubectl -n {{ kube_system_ns }} exec ds/cilium -c cilium-agent -- cilium-dbg config
      register: cdbg
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [cilium, l2]
    - name: Échouer si L2 n'est pas activé
      fail:
        msg: "EnableL2Announcements est désactivé — L2 non activé dans l'agent."
      when: cdbg.stdout is search('EnableL2Announcements:\s*false')
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [cilium, l2]
    - name: Vérifier que Kyverno a préfixé les images Cilium
      block:
        - name: Récupérer les images des pods Cilium
          command: kubectl -n {{ kube_system_ns }} get pods -o jsonpath='{.items[*].spec.containers[*].image}'
          register: cilium_pod_images
          changed_when: false
        - name: Échouer si les images ne sont pas préfixées
          fail:
            msg: >
              Kyverno n'a pas préfixé les images Cilium !
              Images actuelles : {{ cilium_pod_images.stdout }}
          when: "'192.168.200.1:8000/' not in cilium_pod_images.stdout"
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"
      tags: [cilium, verify]
  tags: [cilium]
  become: yes
