[defaults]
jinja2_native = True
ansible_python_interpreter = /usr/bin/python3
inventory = inventory
remote_user = ubuntu
# TODO: Variabalise rôle path or set it relative
roles_path = /home/phil/github/AVR25_Rakuten_MLOps/ansible/roles
private_key_file = ssh/keys/id_rsa
host_key_checking = False
fact_caching = memory

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s


